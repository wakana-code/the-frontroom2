<script type="module">
import * as THREE from 'three';

/* =========================================================================
   0. 小道具：キャンバス手続き型テクスチャ工房
   ========================================================================= */
function cv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return {c,x:c.getContext('2d')};}

function noise$x,w,h,amt=12,alpha=.06,step=1${
  const img=x.getImageData(0,0,w,h),d=img.data;
  for$let i=0;i<d.length;i+=4*step${
    const n=$Math.random()-.5$*amt*2;
    d[i]=Math.max(0,Math.min$255,d[i]+n$);
    d[i+1]=Math.max(0,Math.min$255,d[i+1]+n$);
    d[i+2]=Math.max(0,Math.min$255,d[i+2]+n$);
  }
  x.putImageData(img,0,0);
  x.globalAlpha=alpha;x.globalAlpha=1;
}

function tex$c,rx=1,ry=1,srgb=true${
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx,ry);
  t.anisotropy=8;
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

function grayFrom(c){ // 簡易バンプ用グレースケール
  const g=cv(c.width,c.height);
  g.x.drawImage(c,0,0);
  g.x.globalCompositeOperation='saturation';
  g.x.fillStyle='#808080';g.x.fillRect(0,0,c.width,c.height);
  g.x.globalCompositeOperation='source-over';
  return g.c;
}

/* --- 木目 --- */
function woodCanvas${w=1024,h=1024,base='#8a5a30',dark='#4e3016',light='#b98b57',lines=110,planks=0,knots=3}={}${
  const {c,x}=cv(w,h);
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,base);g.addColorStop(.5,light);g.addColorStop(1,base);
  x.fillStyle=g;x.fillRect(0,0,w,h);
  for$let i=0;i<lines;i++${
    const y=Math.random()*h;
    x.strokeStyle=Math.random()<.55?dark:light;
    x.globalAlpha=.04+Math.random()*.13;
    x.lineWidth=.5+Math.random()*3.4;
    const amp=4+Math.random()*26, ph=Math.random()*6.283, fr=.6+Math.random()*2.4;
    x.beginPath();x.moveTo$-8,y$;
    for$let px=-8;px<=w+8;px+=7${
      x.lineTo$px, y+Math.sin(px/w*fr*6.283+ph)*amp+Math.sin(px/29+ph)*1.8$;
    }
    x.stroke();
  }
  for$let k=0;k<knots;k++${
    const kx=Math.random()*w, ky=Math.random()*h, r=8+Math.random()*16;
    for$let i=0;i<9;i++${
      x.globalAlpha=.10;
      x.strokeStyle=dark;x.lineWidth=1+Math.random()*1.6;
      x.beginPath();
      x.ellipse$kx,ky,r+i*3.2,(r+i*3.2)*.42,Math.random()*.5,0,6.283$;
      x.stroke();
    }
  }
  x.globalAlpha=1;
  if(planks){
    for$let i=1;i<planks;i++${
      const py=h/planks*i;
      x.strokeStyle='rgba(30,17,6,.5)';x.lineWidth=2.2;
      x.beginPath();x.moveTo(0,py);x.lineTo(w,py);x.stroke();
      x.strokeStyle='rgba(255,225,190,.10)';x.lineWidth=1.2;
      x.beginPath();x.moveTo$0,py+2.4$;x.lineTo$w,py+2.4$;x.stroke();
    }
  }
  noise(x,w,h,10,.05,2);
  return c;
}

/* --- 壁紙（淡い縦ストライプ＋小紋） --- */
function wallpaperCanvas(){
  const w=1024,h=1024,{c,x}=cv(w,h);
  x.fillStyle='#cdc4b2';x.fillRect(0,0,w,h);
  for$let i=0;i<w;i+=64${
    x.fillStyle= (i/64)%2 ? 'rgba(255,252,244,.16)':'rgba(120,104,84,.05)';
    x.fillRect(i,0,32,h);
  }
  // 小紋
  x.strokeStyle='rgba(150,132,106,.30)';
  for$let gy=0;gy<h;gy+=128$ for$let gx=0;gx<w;gx+=128${
    const ox=((gy/128)%2)*64;
    x.save();x.translate$gx+ox+32,gy+40$;
    x.lineWidth=1.3;
    x.beginPath();
    for$let a=0;a<6;a++${
      const r1=12,r2=4;
      const t1=a/6*6.283, t2=t1+.52;
      x.moveTo(0,0);
      x.quadraticCurveTo$Math.cos(t1)*r1,Math.sin(t1)*r1,Math.cos(t2)*r2,Math.sin(t2)*r2$;
    }
    x.stroke();
    x.restore();
  }
  // 経年のシミ
  for$let i=0;i<40;i++${
    const sx=Math.random()*w, sy=Math.random()*h, r=20+Math.random()*90;
    const g=x.createRadialGradient(sx,sy,1,sx,sy,r);
    g.addColorStop(0,'rgba(96,78,54,.055)');g.addColorStop(1,'rgba(96,78,54,0)');
    x.fillStyle=g;x.fillRect$sx-r,sy-r,r*2,r*2$;
  }
  noise(x,w,h,9,.05,2);
  return c;
}

/* --- 布（織り） --- */
function fabricCanvas$col='#8e5a52',dark='rgba(0,0,0,.22)'${
  const w=512,h=512,{c,x}=cv(w,h);
  x.fillStyle=col;x.fillRect(0,0,w,h);
  for$let i=0;i<w;i+=4${
    x.fillStyle=dark;x.globalAlpha=.10;x.fillRect(i,0,2,h);
    x.fillStyle='rgba(255,255,255,.09)';x.fillRect$i+2,0,1,h$;
  }
  for$let j=0;j<h;j+=4${
    x.fillStyle=dark;x.globalAlpha=.10;x.fillRect(0,j,w,2);
    x.fillStyle='rgba(255,255,255,.07)';x.fillRect$0,j+2,w,1$;
  }
  x.globalAlpha=1;
  noise(x,w,h,14,.06,2);
  return c;
}

function stripeCanvas$a='#e8e4dc',b='#43536e',pitch=26${
  const w=512,h=512,{c,x}=cv(w,h);
  x.fillStyle=a;x.fillRect(0,0,w,h);
  for$let i=0;i<w;i+=pitch${x.fillStyle=b;x.fillRect$i,0,pitch*.42,h$;}
  noise(x,w,h,12,.05,2);
  return c;
}
function plaidCanvas(){
  const w=512,h=512,{c,x}=cv(w,h);
  x.fillStyle='#7d2f2c';x.fillRect(0,0,w,h);
  const bands=[[0,'rgba(20,18,18,.55)',48],[64,'rgba(232,220,190,.32)',10],[120,'rgba(20,18,18,.35)',26],[190,'rgba(232,220,190,.18)',6]];
  for(const dir of [0,1]){
    for$let o=0;o<w;o+=256${
      for(const [off,col,thick] of bands){
        x.fillStyle=col;
        if$dir===0$x.fillRect$o+off,0,thick,h$; else x.fillRect$0,o+off,w,thick$;
      }
    }
  }
  for$let i=0;i<w;i+=3${x.fillStyle='rgba(0,0,0,.05)';x.fillRect(i,0,1,h);}
  noise(x,w,h,14,.05,2);
  return c;
}
function knitCanvas$col='#c8a86a'${
  const w=512,h=512,{c,x}=cv(w,h);
  x.fillStyle=col;x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(0,0,0,.20)';x.lineWidth=2.2;
  for$let y=0;y<h;y+=16${
    for$let sx=0;sx<w;sx+=16${
      x.beginPath();x.moveTo$sx,y+14$;x.quadraticCurveTo$sx+8,y-4,sx+16,y+14$;x.stroke();
    }
  }
  x.strokeStyle='rgba(255,255,255,.13)';
  for$let y=6;y<h;y+=16${
    for$let sx=0;sx<w;sx+=16${
      x.beginPath();x.moveTo$sx,y+14$;x.quadraticCurveTo$sx+8,y-3,sx+16,y+14$;x.stroke();
    }
  }
  noise(x,w,h,12,.05,2);
  return c;
}

/* --- カーテン（縦のドレープ＋織り） --- */
function curtainCanvas(){
  const w=512,h=1024,{c,x}=cv(w,h);
  x.fillStyle='#cdbfa8';x.fillRect(0,0,w,h);
  for$let i=0;i<w;i+=32${
    const g=x.createLinearGradient$i,0,i+32,0$;
    g.addColorStop(0,'rgba(60,48,34,.20)');
    g.addColorStop(.42,'rgba(255,250,240,.16)');
    g.addColorStop(1,'rgba(60,48,34,.20)');
    x.fillStyle=g;x.fillRect(i,0,32,h);
  }
  for$let j=0;j<h;j+=3${x.fillStyle='rgba(0,0,0,.05)';x.fillRect(0,j,w,1);}
  for$let i=0;i<w;i+=3${x.fillStyle='rgba(255,255,255,.035)';x.fillRect(i,0,1,h);}
  const g2=x.createLinearGradient(0,0,0,h);
  g2.addColorStop(0,'rgba(0,0,0,.16)');g2.addColorStop(.25,'rgba(0,0,0,0)');
  g2.addColorStop(1,'rgba(30,20,10,.14)');
  x.fillStyle=g2;x.fillRect(0,0,w,h);
  noise(x,w,h,10,.05,2);
  return c;
}

/* --- 革（ポーチ） --- */
function leatherCanvas(){
  const w=768,h=768,{c,x}=cv(w,h);
  x.fillStyle='#6b4425';x.fillRect(0,0,w,h);
  for$let i=0;i<2600;i++${
    const sx=Math.random()*w,sy=Math.random()*h,r=2+Math.random()*11;
    x.beginPath();
    x.fillStyle=Math.random()<.5?'rgba(46,27,13,.16)':'rgba(160,116,70,.13)';
    x.ellipse(sx,sy,r,r*$.5+Math.random()*.7$,Math.random()*3,0,6.283);
    x.fill();
  }
  // 革のシワ
  x.strokeStyle='rgba(38,22,10,.16)';
  for$let i=0;i<90;i++${
    x.lineWidth=.7+Math.random()*1.6;
    x.beginPath();
    let px=Math.random()*w,py=Math.random()*h;
    x.moveTo(px,py);
    for$let s=0;s<5;s++${px+=$Math.random()-.5$*90;py+=$Math.random()-.5$*90;x.lineTo(px,py);}
    x.stroke();
  }
  // ステッチ
  x.strokeStyle='rgba(238,214,168,.75)';x.lineWidth=3.4;x.setLineDash([9,9]);
  x.strokeRect$30,30,w-60,h-60$;
  x.strokeStyle='rgba(60,38,18,.5)';x.lineWidth=1.2;
  x.strokeRect$31,31,w-62,h-62$;
  x.setLineDash([]);
  noise(x,w,h,14,.06,2);
  return c;
}

/* --- 本の表紙 --- */
function coverCanvas(o){
  const w=620,h=880,{c,x}=cv(w,h);
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,o.c1);g.addColorStop(.55,o.c2);g.addColorStop(1,o.c1);
  x.fillStyle=g;x.fillRect(0,0,w,h);
  // 布目 / 紙目
  for$let i=0;i<h;i+=4${x.fillStyle='rgba(0,0,0,.05)';x.fillRect(0,i,w,2);}
  for$let i=0;i<w;i+=4${x.fillStyle='rgba(255,255,255,.035)';x.fillRect(i,0,2,h);}
  // 枠
  x.strokeStyle=o.ink;x.globalAlpha=.85;x.lineWidth=3;
  x.strokeRect$46,52,w-92,h-104$;
  x.lineWidth=1;x.strokeRect$56,62,w-112,h-124$;
  x.globalAlpha=1;
  // 帯
  if(o.band){
    x.fillStyle=o.band;x.fillRect$0,h*.70,w,h*.16$;
    x.fillStyle='rgba(0,0,0,.18)';x.fillRect$0,h*.70,w,4$;
    x.fillStyle=o.bandInk||'#20201c';
    x.font='600 30px "Hiragino Kaku Gothic ProN",sans-serif';
    x.textAlign='center';
    x.fillText$o.bandText||'',w/2,h*.70+72$;
  }
  // 記号
  x.strokeStyle=o.ink;x.lineWidth=4;x.globalAlpha=.9;
  x.beginPath();x.arc(w/2,250,72,0,6.283);x.stroke();
  x.lineWidth=2;x.beginPath();x.arc(w/2,250,94,0,6.283);x.stroke();
  if(o.glyph){x.fillStyle=o.ink;x.font='700 74px "Hiragino Mincho ProN",serif';x.textAlign='center';x.fillText(o.glyph,w/2,278);}
  x.globalAlpha=1;
  // タイトル
  x.fillStyle=o.ink;x.textAlign='center';
  x.font='700 '+(o.size||54)+'px "Hiragino Mincho ProN",serif';
  const lines=o.title.split$'\n'$;
  lines.forEach((l,i)=>x.fillText$l,w/2,470+i*(o.size||54)*1.28$);
  x.font='400 24px "Hiragino Kaku Gothic ProN",sans-serif';
  x.globalAlpha=.85;
  x.fillText$o.author,w/2,h-120$;
  x.font='400 17px sans-serif';x.globalAlpha=.6;
  x.fillText$o.pub||'ROOM PRESS',w/2,h-78$;
  x.globalAlpha=1;
  // 擦れ・角のダメージ
  for$let i=0;i<160;i++${
    const sx=Math.random()*w,sy=Math.random()*h;
    const edge=Math.min$sx,sy,w-sx,h-sy$;
    if$edge>70&&Math.random()<.85$continue;
    x.fillStyle='rgba(255,255,255,'+$0.05+Math.random()*.16$+')';
    x.fillRect$sx,sy,1+Math.random()*8,1+Math.random()*5$;
  }
  const vg=x.createRadialGradient$w/2,h/2,h*.2,w/2,h/2,h*.78$;
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.30)');
  x.fillStyle=vg;x.fillRect(0,0,w,h);
  noise(x,w,h,10,.05,2);
  return c;
}
function spineCanvas(o){
